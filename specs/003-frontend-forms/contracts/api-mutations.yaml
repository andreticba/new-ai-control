# api-mutations.yaml | AI-Control v0.0.1 | 13-10-2026 18:05(GMT-04:00)
openapi: 3.0.3
info:
  title: AI-Control Workspace & Membership Mutation API
  version: 0.0.1
  description: Contratos de endpoints para mutações de governança 4-Tier e gestão de membros.

paths:
  /api/v1/workspaces/organizations/:
    post:
      summary: Criar Organização
      operationId: createOrganization
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                org_type:
                  type: string
                  enum: [HEALTHCARE, UNIVERSITY, COMPANY, NGO, GOVERNMENT, INDIVIDUAL, OTHER]
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Organização criada com sucesso
        '400':
          description: Erro de validação de dados ou slug duplicado
        '403':
          description: Permissão insuficiente (exige org.manage)

  /api/v1/workspaces/organizations/{id}/:
    put:
      summary: Atualizar Organização
      operationId: updateOrganization
      tags: [Workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                org_type: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: Organização atualizada com sucesso
        '403':
          description: Permissão insuficiente

  /api/v1/workspaces/departments/:
    post:
      summary: Criar Departamento
      operationId: createDepartment
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name, code]
              properties:
                organization_id: { type: string, format: uuid }
                name: { type: string }
                code: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Departamento criado
        '400':
          description: Código duplicado para a organização

  /api/v1/workspaces/projects/:
    post:
      summary: Criar Projeto
      operationId: createProject
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name]
              properties:
                organization_id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
                project_type:
                  type: string
                  enum: [RESEARCH, DEVELOPMENT, OPERATIONAL, CONSULTING, OTHER]
                status:
                  type: string
                  enum: [PLANNING, ACTIVE, PAUSED, COMPLETED, CANCELLED]
                description: { type: string }
      responses:
        '201':
          description: Projeto criado com sucesso

  /api/v1/workspaces/squads/:
    post:
      summary: Criar Squad (Inviolabilidade P3)
      operationId: createSquad
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
                mission: { type: string }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Squad criada com sucesso
        '400':
          description: Projeto pai inválido ou ausente (Violação P3)

  /api/v1/workspaces/memberships/organization/:
    post:
      summary: Alocar Membro na Organização
      operationId: allocateOrgMember
      tags: [Memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, user_id, role_id]
              properties:
                organization_id: { type: string, format: uuid }
                user_id: { type: integer }
                role_id: { type: string, format: uuid }
                job_title_id: { type: string, format: uuid }
                department_id: { type: string, format: uuid }
      responses:
        '201':
          description: Membro vinculado à organização

  /api/v1/workspaces/memberships/squad/:
    post:
      summary: Alocar Membro na Squad (Validação Contínua P3)
      operationId: allocateSquadMember
      tags: [Memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [squad_id, user_id, role_id]
              properties:
                squad_id: { type: string, format: uuid }
                user_id: { type: integer }
                role_id: { type: string, format: uuid }
                job_title_id: { type: string, format: uuid }
      responses:
        '201':
          description: Membro vinculado à squad
        '400':
          description: Usuário não possui vínculo ativo no projeto pai (Violação P3)

  /api/v1/users/quick-onboard/:
    post:
      summary: Onboarding Rápido de Usuário (Blind Indexing)
      operationId: quickOnboardUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, full_name]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                full_name: { type: string }
      responses:
        '201':
          description: Usuário e perfil criados com tokens blind indexing gerados
        '400':
          description: Username ou email duplicado
        '403':
          description: Permissão insuficiente (exige org.manage)
